services:
  - type: web
    name: mpharmagroup
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: groupmpharma@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: groupmpharma@gmail.com
      - key: MAIL_USE_TLS
        value: "true"
