<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ brand.strong }} {{ brand.light }} - {{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <div class="auth-split" aria-hidden="true"></div>
    <section class="auth-panel">
      <p class="auth-brand"><span class="brand-mark" aria-hidden="true">+</span><span><strong>{{ brand.strong }}</strong> {{ brand.light }}</span></p>
      {% block auth_content %}{% endblock %}
    </section>
  </main>
</body>
</html>
