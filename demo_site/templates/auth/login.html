{% extends "auth/base.html" %}

{% block auth_content %}
<form class="auth-form" method="post" action="{{ url_for('login') }}" novalidate>
  <input type="hidden" name="redirect_url" value="{{ redirect_url }}">
  <label class="sr-only" for="email">E-mail</label>
  <input id="email" class="input" type="email" name="email" placeholder="E-mail" value="{{ values.email }}">
  {% if errors.email %}<p class="field-error">{{ errors.email }}</p>{% endif %}

  <label class="sr-only" for="password">Mot de passe</label>
  <input id="password" class="input" type="password" name="password" placeholder="Mot de passe">
  {% if errors.password %}<p class="field-error">{{ errors.password }}</p>{% endif %}

  <label class="sr-only" for="group-id">Groupement de pharmacies</label>
  <select id="group-id" class="input" name="group_id" required>
    {% for group in groups %}
      <option value="{{ group.id }}" {% if group.id|string == selected_group_id|string %}selected{% endif %}><span data-no-translate>{{ group.name }}</span></option>
    {% endfor %}
  </select>
  {% if errors.group_id %}<p class="field-error">{{ errors.group_id }}</p>{% endif %}

  <label class="check-row">
    <input type="checkbox" name="remember_me" value="1" {% if values.remember == "1" %}checked{% endif %}>
    <span></span>
    <b>Se souvenir de moi</b>
  </label>

  <button class="btn btn-primary auth-submit" type="submit">Se connecter</button>
</form>
<footer class="auth-footer">
  <a href="{{ url_for('password_recovery') }}">Mot de passe oublié</a>
</footer>
{% endblock %}
